name: Validate project controls

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate management and content artifacts
        shell: pwsh
        run: ./scripts/Test-Project.ps1
